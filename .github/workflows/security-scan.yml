name: 🔒 Security Scan with Horusec

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop, 'feat/**' ]

jobs:
  security-scan:
    name: 🔍 Horusec Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Mismo que tus otros workflows
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Solo instalar npm si tienes package.json
    - name: 📦 Install Node dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: 🔒 Instalar y ejecutar Horusec
      id: security_scan
      run: |
        echo "🔍 Iniciando análisis de seguridad..."
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest
        
        # Ejecutar Horusec con configuración
        ./horusec start -p="./" -e="true" --config-file-path="./horusec-config.json" || exit_code=$?
        
        # Verificar resultado
        if [ ${exit_code:-0} -ne 0 ]; then
          echo "❌ VULNERABILIDADES CRÍTICAS ENCONTRADAS!"
          echo "🚫 Pipeline bloqueado por seguridad"
          exit $exit_code
        else
          echo "✅ Análisis de seguridad completado exitosamente"
        fi
      continue-on-error: false
    
    - name: 📊 Upload security results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: horusec-security-report
        path: |
          ./horusec-*.json
          ./horusec-*.txt
        retention-days: 7
